<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --green: #00c853;
        --yellow: #ffd600;
        --blue: #2962ff;
        --cream: #fff8e7;
        --orange: #ff6d00;
        --black: #111111;
        --white: #ffffff;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--cream);
        color: var(--black);
        min-height: 100vh;
        overflow-x: hidden;
    }

    .container {
        max-width: 1300px;
        margin: auto;
        padding: 40px 20px;
    }

    /* HEADER */

    header {
        text-align: center;
        margin-bottom: 50px;
    }

    .logo {
        font-size: 4rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--black);
        background: var(--yellow);
        border: 5px solid var(--black);
        display: inline-block;
        padding: 15px 30px;
        box-shadow: 10px 10px 0 var(--black);
        letter-spacing: 3px;
    }

    .divider {
        display: none;
    }

    .tagline {
        margin-top: 20px;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--black);
    }

    /* SEARCH */

    .search-section {
        margin-bottom: 50px;
    }

    .search-container {
        position: relative;
        max-width: 700px;
        margin: auto;
    }

    .search-input {
        width: 100%;
        padding: 20px;
        font-size: 1rem;
        border: 5px solid var(--black);
        background: var(--white);
        outline: none;
        font-weight: 700;
        box-shadow: 8px 8px 0 var(--blue);
    }

    .search-input:focus {
        transform: translate(-2px, -2px);
        box-shadow: 12px 12px 0 var(--orange);
    }

    /* AUTOCOMPLETE */

    .autocomplete-list {
        position: absolute;
        top: 105%;
        width: 100%;
        background: var(--white);
        border: 4px solid var(--black);
        list-style: none;
        display: none;
        max-height: 300px;
        overflow-y: auto;
        z-index: 999;
        box-shadow: 8px 8px 0 var(--black);
    }

    .autocomplete-list.active {
        display: block;
    }

    .autocomplete-item {
        padding: 15px;
        cursor: pointer;
        font-weight: 700;
        border-bottom: 3px solid var(--black);
        transition: 0.2s;
    }

    .autocomplete-item:hover {
        background: var(--yellow);
        transform: translateX(5px);
    }

    /* BUTTON */

    .btn {
        margin-top: 25px;
        width: 100%;
        padding: 18px;
        border: 5px solid var(--black);
        background: var(--green);
        color: var(--black);
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 8px 8px 0 var(--black);
        transition: 0.15s;
    }

    .btn:hover {
        transform: translate(-3px, -3px);
        box-shadow: 12px 12px 0 var(--black);
    }

    .btn:active {
        transform: translate(3px, 3px);
        box-shadow: 3px 3px 0 var(--black);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* TITLES */

    .results-title {
        margin-bottom: 30px;
        font-size: 2rem;
        font-weight: 900;
        text-transform: uppercase;
        background: var(--orange);
        border: 5px solid var(--black);
        padding: 15px;
        box-shadow: 8px 8px 0 var(--black);
    }

    /* SELECTED MOVIE */

    .selected-movie-section {
        display: flex;
        gap: 30px;
        align-items: center;
        margin-bottom: 50px;
        background: var(--blue);
        border: 5px solid var(--black);
        padding: 25px;
        box-shadow: 10px 10px 0 var(--black);
    }

    .selected-movie-poster {
        width: 180px;
        border: 5px solid var(--black);
    }

    .selected-movie-info h2 {
        font-size: 2rem;
        font-weight: 900;
        color: var(--white);
        margin-bottom: 10px;
    }

    .selected-movie-info p {
        color: var(--cream);
        font-weight: 700;
    }

    /* GRID */

    .recommendations-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 30px;
    }

    /* CARD */

    .movie-card {
        background: var(--white);
        border: 5px solid var(--black);
        overflow: hidden;
        box-shadow: 10px 10px 0 var(--black);
        transition: 0.2s;
    }

    .movie-card:hover {
        transform: rotate(-1deg) translateY(-5px);
    }

    .movie-poster {
        width: 100%;
        height: 350px;
        object-fit: cover;
        border-bottom: 5px solid var(--black);
    }

    .movie-poster-placeholder {
        width: 100%;
        height: 350px;
        background: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 5rem;
        border-bottom: 5px solid var(--black);
    }

    .movie-card-content {
        padding: 20px;
    }

    .movie-icon {
        width: 55px;
        height: 55px;
        background: var(--orange);
        border: 4px solid var(--black);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-bottom: 15px;
    }

    .movie-title {
        font-size: 1.2rem;
        font-weight: 900;
        margin-bottom: 15px;
        line-height: 1.5;
    }

    .similarity-badge {
        display: inline-block;
        padding: 10px 15px;
        background: var(--green);
        border: 4px solid var(--black);
        font-weight: 900;
        box-shadow: 4px 4px 0 var(--black);
    }

    /* ERROR */

    .error-message {
        background: #ff5252;
        border: 5px solid var(--black);
        padding: 20px;
        font-weight: 800;
        margin-bottom: 30px;
        box-shadow: 8px 8px 0 var(--black);
    }

    /* MOBILE */

    @media(max-width: 768px) {

        .logo {
            font-size: 2.5rem;
        }

        .selected-movie-section {
            flex-direction: column;
            text-align: center;
        }

        .selected-movie-poster {
            width: 140px;
        }

        .results-title {
            font-size: 1.4rem;
        }
    }
</style>    
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Movies4u</div>
            <div class="divider"></div>
            <p class="tagline">Discover Your Next Favorite Film</p>
        </header>

        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search for a movie..."
                    autocomplete="off"
                >
                <ul id="autocompleteList" class="autocomplete-list"></ul>
            </div>
            <button id="recommendBtn" class="btn btn-primary" disabled>
                Get Recommendations
            </button>
        </section>

        <section class="results-section">
            <div id="errorContainer"></div>
            <div id="resultsContainer"></div>
        </section>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocompleteList');
        const recommendBtn = document.getElementById('recommendBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const errorContainer = document.getElementById('errorContainer');

        let selectedMovie = '';

        // Autocomplete functionality
        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            
            if (!query) {
                autocompleteList.classList.remove('active');
                recommendBtn.disabled = true;
                selectedMovie = '';
                return;
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const movies = await response.json();
                
                autocompleteList.innerHTML = '';
                
                if (movies.length > 0) {
                    movies.forEach(movie => {
                        const li = document.createElement('li');
                        li.className = 'autocomplete-item';
                        li.textContent = movie;
                        li.addEventListener('click', () => selectMovie(movie));
                        autocompleteList.appendChild(li);
                    });
                    autocompleteList.classList.add('active');
                } else {
                    autocompleteList.classList.remove('active');
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        });

        function selectMovie(movie) {
            selectedMovie = movie;
            searchInput.value = movie;
            autocompleteList.classList.remove('active');
            recommendBtn.disabled = false;
            recommendBtn.focus();
        }

        // Click outside to close autocomplete
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                autocompleteList.classList.remove('active');
            }
        });

        // Recommendation functionality
        recommendBtn.addEventListener('click', async () => {
            if (!selectedMovie) return;

            errorContainer.innerHTML = '';
            recommendBtn.disabled = true;
            recommendBtn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        movie_name: selectedMovie,
                        num_recommendations: 8
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get recommendations');
                }

                displayRecommendations(data);
            } catch (error) {
                errorContainer.innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
            } finally {
                recommendBtn.disabled = false;
                recommendBtn.textContent = 'Get Recommendations';
            }
        });

        function displayRecommendations(data) {
            const { selected_movie, selected_poster, recommendations } = data;

            let html = `
                <div class="results-title">
                    📽️ Because you liked "<em>${escapeHtml(selected_movie)}</em>"
                </div>
            `;

            // Show selected movie with poster if available
            if (selected_poster) {
                html += `
                    <div class="selected-movie-section">
                        <img src="${selected_poster}" alt="${escapeHtml(selected_movie)}" class="selected-movie-poster">
                        <div class="selected-movie-info">
                            <h2>${escapeHtml(selected_movie)}</h2>
                            <p>Your Selection</p>
                        </div>
                    </div>
                `;
            }

            html += '<div class="recommendations-grid">';

            recommendations.forEach((movie, index) => {
                const posterHtml = movie.poster 
                    ? `<img src="${movie.poster}" alt="${escapeHtml(movie.title)}" class="movie-poster">`
                    : `<div class="movie-poster-placeholder">🎬</div>`;

                html += `
                    <div class="movie-card" style="animation: fadeInUp ${0.3 + index * 0.1}s ease-out forwards;">
                        ${posterHtml}
                        <div class="movie-card-content">
                            <div class="movie-icon">⭐</div>
                            <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                            <div class="similarity-badge">${movie.similarity}% Match</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial setup
        searchInput.focus();
    </script>
</body>
</html>
